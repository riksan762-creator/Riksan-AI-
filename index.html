<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riksan AI - Pro</title>
  <link rel="stylesheet" href="style.css?v=1.0.5">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="top-bar">
    <button class="icon-btn" id="menuBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="title">Riksan AI</div>
    <button class="icon-btn new-chat-btn">
      <i data-lucide="square-pen"></i>
    </button>
  </header>

  <main class="chat-area" id="chatBox">
    <div class="empty-state" id="emptyState">
      <div class="logo-wrapper">
        <i data-lucide="cpu" class="logo-icon"></i>
      </div>
      <div class="suggestions">
        <button onclick="setSuggestion('Bantu cari bug di kode JavaScript ini')">
          <i data-lucide="code-2"></i> Cari Bug Kode
        </button>
        <button onclick="setSuggestion('Buatkan struktur database MySQL')">
          <i data-lucide="database"></i> Arsitektur Database
        </button>
        <button onclick="setSuggestion('Buat fungsi Python untuk scraping')">
          <i data-lucide="terminal"></i> Script Python
        </button>
      </div>
    </div>
  </main>

  <footer class="input-container">
    <form id="chatForm" class="input-box">
      <button type="button" class="add-btn">
        <i data-lucide="plus"></i>
      </button>
      <textarea id="userInput" placeholder="Tanya Riksan AI..." rows="1"></textarea>
      <div class="right-actions">
        <button type="button" class="voice-btn">
          <i data-lucide="mic"></i>
        </button>
        <button type="submit" id="sendBtn" class="send-btn" disabled>
          <i data-lucide="arrow-up"></i>
        </button>
      </div>
    </form>
  </footer>

  <script src="script.js?v=1.0.5"></script>
</body>
</html>
