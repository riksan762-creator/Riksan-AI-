<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riksan AI - Pro Colored</title>
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="style.css?v=2.0.0">
  
  <!-- CDN Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- CDN Highlight.js untuk Mewarnai Kode (Tema Atom One Dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <header class="top-bar">
    <button class="icon-btn" id="menuBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="title">Riksan AI</div>
    <button class="icon-btn new-chat-btn">
      <i data-lucide="square-pen"></i>
    </button>
  </header>

  <main class="chat-area" id="chatBox">
    <div class="empty-state" id="emptyState">
      <div class="logo-wrapper">
        <i data-lucide="cpu" class="logo-icon"></i>
      </div>
      <div class="suggestions">
        <button onclick="setSuggestion('Buatkan form login dengan HTML dan CSS')">
          <i data-lucide="code-2"></i> Form Login HTML CSS
        </button>
        <button onclick="setSuggestion('Buatkan fungsi JavaScript untuk kalkulator')">
          <i data-lucide="terminal"></i> Fungsi Kalkulator JS
        </button>
        <button onclick="setSuggestion('Buatkan struktur tabel user di MySQL')">
          <i data-lucide="database"></i> Struktur Tabel MySQL
        </button>
      </div>
    </div>
  </main>

  <footer class="input-container">
    <form id="chatForm" class="input-box">
      <button type="button" class="add-btn">
        <i data-lucide="plus"></i>
      </button>
      <textarea id="userInput" placeholder="Tanya Riksan AI..." rows="1"></textarea>
      <div class="right-actions">
        <button type="button" class="voice-btn">
          <i data-lucide="mic"></i>
        </button>
        <button type="submit" id="sendBtn" class="send-btn" disabled>
          <i data-lucide="arrow-up"></i>
        </button>
      </div>
    </form>
  </footer>

  <script src="script.js?v=2.0.0"></script>
</body>
</html>
