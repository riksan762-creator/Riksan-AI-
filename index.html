<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riksan AI - Logic Solver</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <button class="new-chat-btn">
        <i data-lucide="plus"></i> Baru
      </button>
      <div class="sidebar-footer">
        <span class="version">Riksan AI v1.0 • Groq Engine</span>
      </div>
    </aside>

    <main class="chat-container">
      <header class="chat-header">
        <h1>Riksan <span>AI</span></h1>
      </header>

      <div class="messages-box" id="chatBox">
        <div class="message assistant">
          <div class="avatar"><i data-lucide="cpu"></i></div>
          <div class="text">Halo! Saya Riksan AI. Ada logika rumit atau arsitektur kode yang perlu kita pecahkan hari ini? Mari kita buat sistem Anda jadi lebih powerful.</div>
        </div>
      </div>

      <footer class="input-area">
        <form id="chatForm" class="input-wrapper">
          <textarea id="userInput" placeholder="Ketik masalah logika atau kode Anda di sini..." rows="1"></textarea>
          <button type="submit" id="sendBtn">
            <i data-lucide="arrow-up"></i>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
