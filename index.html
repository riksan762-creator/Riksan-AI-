<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riksan AI</title>
  
  <!-- Pemanggilan CSS dengan Cache Busting agar UI Kapsul Premium Terbaca Sempurna -->
  <link rel="stylesheet" href="style.css?v=1.0.2">
  
  <!-- CDN Lucide Icons untuk Ikon ChatGPT Style -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Top Navbar Minimalis -->
    <header class="top-nav">
      <button class="nav-btn" id="menuBtn">
        <i data-lucide="menu"></i>
      </button>
      <div class="header-title">Riksan AI</div>
      <button class="nav-btn new-chat-btn">
        <i data-lucide="square-pen"></i>
      </button>
    </header>

    <!-- Chat Workspace Area -->
    <main class="chat-main">
      <div class="messages-container" id="chatBox">
        
        <!-- Tampilan Awal Menu Pintasan Kosong ala ChatGPT Mobile -->
        <div class="initial-screen" id="initialScreen">
          <div class="welcome-logo">
            <i data-lucide="cpu"></i>
          </div>
          <div class="shortcut-list">
            <button class="shortcut-item" onclick="setSuggestion('Bantu pecahkan bug kode JavaScript ini')">
              <i data-lucide="code-2"></i> <span>Pecahkan Bug Kode</span>
            </button>
            <button class="shortcut-item" onclick="setSuggestion('Buatkan arsitektur database yang efisien')">
              <i data-lucide="database"></i> <span>Desain Arsitektur DB</span>
            </button>
            <button class="shortcut-item" onclick="setSuggestion('Optimasi logika fungsi berikut agar lebih cepat')">
              <i data-lucide="zap"></i> <span>Optimasi Logika</span>
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- Floating Input Kapsul ala ChatGPT Mobile -->
    <footer class="input-area">
      <form id="chatForm" class="input-pill">
        <button type="button" class="pill-icon-btn">
          <i data-lucide="plus"></i>
        </button>
        <textarea id="userInput" placeholder="Tanya Riksan AI..." rows="1"></textarea>
        <button type="submit" id="sendBtn" class="send-btn">
          <i data-lucide="arrow-up"></i>
        </button>
      </form>
    </footer>
  </div>

  <!-- Pemanggilan JS dengan Cache Busting -->
  <script src="script.js?v=1.0.2"></script>
</body>
</html>
